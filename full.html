<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小番茄图片混淆 / 解混淆</title>
<style>
  :root { --primary:#2d7ff9; --disabled:#9bbcf5; --border:#d8dbe0; --bg:#f5f6f8; --text:#2c2f33; --muted:#7a7f87; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--text); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; font-size:14px; }
  .container { max-width:900px; margin:0 auto; background:#fff; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.08); padding:20px 24px; }
  
  /* Tab 切换 */
  .tabs { display:flex; border-bottom:2px solid var(--border); margin-bottom:18px; }
  .tab-btn { padding:10px 20px; background:none; border:none; font-size:16px; font-weight:600; color:var(--muted); cursor:pointer; outline:none; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .2s; }
  .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }
  .tab-content { display:none; }
  .tab-content.active { display:block; }

  .field { margin-bottom:14px; }
  .field > label.title { display:block; margin-bottom:6px; font-weight:500; }
  .inline { display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
  
  input[type="text"], input[type="number"] { height:34px; padding:0 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; outline:none; }
  input[type="text"]:focus, input[type="number"]:focus { border-color:var(--primary); }
  input.prefix { width:240px; } input.times { width:60px; text-align:center; }
  
  button { padding:0 14px; height:34px; border:none; border-radius:6px; font-size:14px; cursor:pointer; transition:all .2s; }
  button:disabled { opacity:0.6; cursor:not-allowed; }
  button.primary { background:var(--primary); color:#fff; height:38px; padding:0 24px; font-weight:600; }
  button.secondary { background:#e8eaed; color:var(--text); }
  button.secondary:hover { background:#dfe2e6; }
  
  .radio-group label, .checkbox-group label { display:inline-flex; align-items:center; gap:6px; margin-right:18px; cursor:pointer; user-select:none; }
  .times-group { display:inline-flex; align-items:center; gap:6px; }
  .times-btns { display:flex; flex-direction:column; gap:2px; }
  .times-btns button { width:26px; height:16px; padding:0; border:1px solid var(--border); border-radius:4px; background:#f2f4f7; font-size:10px; line-height:14px; display:flex; align-items:center; justify-content:center; }
  .times-btns button:hover { background:#e6e9ee; }

  /* 图片列表 */
  .file-list-box { margin-top:8px; max-height:110px; overflow-y:auto; border:1px solid #eef0f3; border-radius:6px; background:#fafbfc; padding:6px; }
  .file-item { display:flex; justify-content:space-between; align-items:center; padding:4px 8px; border-bottom:1px solid #f0f0f0; font-size:13px; }
  .file-item:last-child { border-bottom:none; }
  .file-item span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; margin-right:10px; }
  .btn-del { color:#ff4d4f; background:none; padding:2px 6px; height:auto; border-radius:4px; font-weight:bold; }
  .btn-del:hover { background:#ffeaea; }

  .actions { display:flex; gap:10px; margin:18px 0 10px; }
  
  progress { width:100%; height:16px; margin:8px 0; appearance:none; border:none; border-radius:8px; overflow:hidden; background:#eef0f3; }
  progress::-webkit-progress-bar { background:#eef0f3; }
  progress::-webkit-progress-value { background:var(--primary); }
  progress::-moz-progress-bar { background:var(--primary); }
  
  #status1, #status2 { color:var(--muted); font-size:13px; margin-bottom:6px; }
  
  .log-box { height:180px; overflow-y:auto; padding:10px 12px; border:1px solid var(--border); border-radius:6px; background:#fafbfc; color:#333; font-family:Consolas,"Courier New",monospace; font-size:13px; line-height:1.6; white-space:pre-wrap; word-break:break-all; user-select:none; }
  .hint { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="container">
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('restore')">解混淆</button>
    <button class="tab-btn" onclick="switchTab('obfuscate')">混淆</button>
  </div>

  <!-- ================= 解混淆页面 ================= -->
  <div id="tab-restore" class="tab-content active">
    <div class="field">
      <label class="title">输入图片</label>
      <div class="inline">
        <input type="file" id="fileInput1" accept="image/*" multiple>
        <button class="secondary" onclick="clearAll(1)">清空列表</button>
        <span class="hint">选择图片后，可在列表右侧点击 X 移除</span>
      </div>
      <div class="file-list-box" id="fileList1">未选择文件</div>
    </div>

    <div class="field">
      <label class="title">输出文件名前缀</label>
      <div class="inline">
        <input type="text" id="outName1" class="prefix" value="restored">
        <span class="hint">实际文件名：前缀_原文件名_方向[_x次数].png</span>
      </div>
    </div>

    <div class="field">
      <label class="title">参数设置</label>
      <div class="inline radio-group">
        <label><input type="radio" name="dir1" value="A" checked> A（反向偏移）</label>
        <label><input type="radio" name="dir1" value="B"> B（正向偏移）</label>
        <label style="margin-left:16px;"><input type="checkbox" id="both1"> 同时输出 A 和 B</label>
      </div>
    </div>

    <div class="field">
      <label class="title">解混淆次数</label>
      <div class="times-group">
        <input type="number" id="times1" class="times" value="1" min="1">
        <div class="times-btns">
          <button type="button" onclick="stepTimes(1, 1)">▲</button>
          <button type="button" onclick="stepTimes(1, -1)">▼</button>
        </div>
        <span class="hint">最小 1</span>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="btnStart1" onclick="startProcess(1)">开始批量解混淆</button>
      <button class="secondary" onclick="clearLog(1)">清空日志</button>
    </div>

    <progress id="progress1" value="0" max="100"></progress>
    <div id="status1">就绪</div>
    <div class="log-box" id="log1" ondblclick="copyLog(event, 1)" title="双击全选复制">等待开始...</div>
  </div>

  <!-- ================= 混淆页面 ================= -->
  <div id="tab-obfuscate" class="tab-content">
    <div class="field">
      <label class="title">输入图片</label>
      <div class="inline">
        <input type="file" id="fileInput2" accept="image/*" multiple>
        <button class="secondary" onclick="clearAll(2)">清空列表</button>
        <span class="hint">选择图片后，可在列表右侧点击 X 移除</span>
      </div>
      <div class="file-list-box" id="fileList2">未选择文件</div>
    </div>

    <div class="field">
      <label class="title">输出文件名前缀</label>
      <div class="inline">
        <input type="text" id="outName2" class="prefix" value="obfuscated">
        <span class="hint">实际文件名：前缀_原文件名_方向[_x次数].png</span>
      </div>
    </div>

    <div class="field">
      <label class="title">参数设置</label>
      <div class="inline radio-group">
        <label><input type="radio" name="dir2" value="A" checked> A（反向偏移）</label>
        <label><input type="radio" name="dir2" value="B"> B（正向偏移）</label>
        <label style="margin-left:16px;"><input type="checkbox" id="both2"> 同时输出 A 和 B</label>
      </div>
    </div>

    <div class="field">
      <label class="title">混淆次数</label>
      <div class="times-group">
        <input type="number" id="times2" class="times" value="1" min="1">
        <div class="times-btns">
          <button type="button" onclick="stepTimes(2, 1)">▲</button>
          <button type="button" onclick="stepTimes(2, -1)">▼</button>
        </div>
        <span class="hint">最小 1</span>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="btnStart2" onclick="startProcess(2)">开始批量混淆</button>
      <button class="secondary" onclick="clearLog(2)">清空日志</button>
    </div>

    <progress id="progress2" value="0" max="100"></progress>
    <div id="status2">就绪</div>
    <div class="log-box" id="log2" ondblclick="copyLog(event, 2)" title="双击全选复制">等待开始...</div>
  </div>

</div>

<script type="module">
/* ================= 界面 Tab 切换逻辑 ================= */
window.switchTab = function(tabName) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  
  document.getElementById('tab-' + tabName).classList.add('active');
  event.target.classList.add('active');
};

/* ================= 文件列表管理 ================= */
const fileStore = {
  1: [], // 解混淆
  2: []  // 混淆
};

function renderFileList(id) {
  const listEl = document.getElementById('fileList' + id);
  const files = fileStore[id];
  if (!files.length) {
    listEl.innerHTML = "未选择文件";
    return;
  }
  listEl.innerHTML = files.map((f, idx) => `
    <div class="file-item">
      <span>${f.name} (${(f.size/1024).toFixed(1)} KB)</span>
      <button class="btn-del" onclick="removeFile(${id}, ${idx})">×</button>
    </div>
  `).join('');
}

window.removeFile = function(id, index) {
  fileStore[id].splice(index, 1);
  renderFileList(id);
};

window.clearAll = function(id) {
  fileStore[id] = [];
  document.getElementById('fileInput' + id).value = '';
  renderFileList(id);
};

[1, 2].forEach(id => {
  document.getElementById('fileInput' + id).addEventListener('change', (e) => {
    const newFiles = Array.from(e.target.files);
    newFiles.forEach(f => {
      // 简单的去重，根据文件名和大小
      if (!fileStore[id].some(existing => existing.name === f.name && existing.size === f.size)) {
        fileStore[id].push(f);
      }
    });
    e.target.value = ''; // 允许重复选择同一文件
    renderFileList(id);
  });
});

/* ================= 次数步进 ================= */
window.stepTimes = function(id, delta) {
  const input = document.getElementById('times' + id);
  let val = parseInt(input.value, 10);
  if (isNaN(val) || val < 1) val = 1;
  val += delta;
  if (val < 1) val = 1;
  input.value = val;
};

[1, 2].forEach(id => {
  const input = document.getElementById('times' + id);
  input.addEventListener('blur', () => {
    let val = parseInt(input.value, 10);
    if (isNaN(val) || val < 1) val = 1;
    input.value = val;
  });
});

/* ================= 日志与状态 ================= */
window.clearLog = function(id) {
  document.getElementById('log' + id).textContent = "";
  document.getElementById('status' + id).textContent = "就绪";
  document.getElementById('progress' + id).value = 0;
};

window.copyLog = function(e, id) {
  const logEl = document.getElementById('log' + id);
  const selection = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(logEl);
  selection.removeAllRanges();
  selection.addRange(range);
  
  try {
    document.execCommand('copy');
    document.getElementById('status' + id).textContent = "已复制全部日志到剪贴板";
  } catch (err) {}
};

function appendLog(id, text) {
  const logEl = document.getElementById('log' + id);
  if (logEl.textContent === "等待开始...") logEl.textContent = "";
  logEl.textContent += text + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(id, text) { document.getElementById('status' + id).textContent = text; }
function setProgress(id, val) { document.getElementById('progress' + id).value = val; }


/* ================= 核心算法（与 full.py 严格对齐） ================= */
function sgn(x) { return x < 0 ? -1 : (x > 0 ? 1 : 0); }

function* generate2d(x, y, ax, ay, bx, by) {
  const w = Math.abs(ax + ay), h = Math.abs(bx + by);
  const dax = sgn(ax), day = sgn(ay), dbx = sgn(bx), dby = sgn(by);
  if (h === 1) { for (let i=0;i<w;i++){ yield [x,y]; x+=dax; y+=day; } return; }
  if (w === 1) { for (let i=0;i<h;i++){ yield [x,y]; x+=dbx; y+=dby; } return; }

  let ax2 = Math.floor(ax / 2), ay2 = Math.floor(ay / 2);
  let bx2 = Math.floor(bx / 2), by2 = Math.floor(by / 2);
  const w2 = Math.abs(ax2 + ay2), h2 = Math.abs(bx2 + by2);

  if (2*w > 3*h) {
    if ((w2 % 2) && (w > 2)) { ax2 += dax; ay2 += day; }
    yield* generate2d(x, y, ax2, ay2, bx, by);
    yield* generate2d(x + ax2, y + ay2, ax - ax2, ay - ay2, bx, by);
  } else {
    if ((h2 % 2) && (h > 2)) { bx2 += dbx; by2 += dby; }
    yield* generate2d(x, y, bx2, by2, ax2, ay2);
    yield* generate2d(x + bx2, y + by2, ax, ay, bx - bx2, by - by2);
    yield* generate2d(
      x + (ax - dax) + (bx2 - dbx),
      y + (ay - day) + (by2 - dby),
      -bx2, -by2, -(ax - ax2), -(ay - ay2)
    );
  }
}

function* gilbert2d(width, height) {
  if (width >= height) yield* generate2d(0, 0, width, 0, 0, height);
  else yield* generate2d(0, 0, 0, height, width, 0);
}

function processPixels(src, width, height, direction, times, isRestore) {
  const total = width * height;
  const dst = new Uint8ClampedArray(total * 4);
  const offset = Math.round(((Math.sqrt(5)-1)/2) * total);
  
  // 与 Python 逻辑对齐：
  // Python:
  // base_sign = -1 if direction == "A" else 1
  // if not inverse: base_sign = -base_sign
  // np.roll(seq, base_sign * offset * times) 
  // => out[i] = seq[i - base_sign * offset * times]
  let base_sign = direction === "A" ? -1 : 1;
  if (!isRestore) base_sign = -base_sign;
  
  // 相当于 shiftTotal = -(base_sign) * offset * times
  const shiftTotal = -(base_sign) * offset * times;

  const coords = new Int32Array(total * 2);
  let idx = 0;
  for (const [x,y] of gilbert2d(width,height)) { coords[idx++]=x; coords[idx++]=y; }
  if (idx !== total*2) throw new Error("曲线点数与像素数不匹配");

  for (let i=0;i<total;i++) {
    // src[(i + shiftTotal) % total]
    const srcIdx = ((i + shiftTotal) % total + total) % total;
    const sx = coords[srcIdx*2], sy = coords[srcIdx*2+1];
    const sBase = (sy*width + sx) * 4;
    const tx = coords[i*2], ty = coords[i*2+1];
    const tBase = (ty*width + tx) * 4;
    dst[tBase]=src[sBase]; dst[tBase+1]=src[sBase+1];
    dst[tBase+2]=src[sBase+2]; dst[tBase+3]=src[sBase+3];
  }
  return dst;
}

/* ================= 像素读取与写回 ================= */
async function readPixelsPureJS(file) {
  const { default: readPixels } = await import('https://cdn.skypack.dev/read-pixels');
  const arrayBuffer = await file.arrayBuffer();
  const result = await readPixels({ data: arrayBuffer });
  return { data: result.pixels, width: result.width, height: result.height, mode: "纯JS解码" };
}

async function readPixelsWebCodecs(file) {
  if (typeof ImageDecoder === "undefined") throw new Error("WebCodecs 不可用");
  const type = file.type || guessMime(file.name);
  if (!type) throw new Error("无法确定 MIME 类型");
  const decoder = new ImageDecoder({
    data: file.stream(), type,
    colorSpaceConversion: "none", preferAnimation: false,
  });
  await decoder.tracks.ready;
  const { image } = await decoder.decode({ frameIndex: 0 });
  const width = image.displayWidth || image.codedWidth;
  const height = image.displayHeight || image.codedHeight;
  const allocSize = image.allocationSize({ format: "RGBA" });
  const buffer = new Uint8Array(allocSize);
  await image.copyTo(buffer, { format: "RGBA" });
  image.close(); decoder.close();

  const stride = buffer.length / height;
  let packed;
  if (stride === width * 4) {
    packed = new Uint8ClampedArray(buffer.buffer, buffer.byteOffset, buffer.byteLength);
  } else {
    packed = new Uint8ClampedArray(width * height * 4);
    for (let y = 0; y < height; y++) {
      packed.set(buffer.subarray(y*stride, y*stride + width*4), y*width*4);
    }
  }
  return { data: packed, width, height, mode: "WebCodecs 原始像素" };
}

function guessMime(name) {
  const ext = name.split(".").pop().toLowerCase();
  const map = { png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg", webp:"image/webp", gif:"image/gif", bmp:"image/bmp" };
  return map[ext] || "";
}

async function readPixelsBitmap(file) {
  const bitmap = await createImageBitmap(file, {
    colorSpaceConversion: "none", premultiplyAlpha: "none", imageOrientation: "none",
  });
  const width = bitmap.width, height = bitmap.height;
  const canvas = typeof OffscreenCanvas !== "undefined"
    ? new OffscreenCanvas(width, height)
    : Object.assign(document.createElement("canvas"), { width, height });
  const ctx = canvas.getContext("2d", { willReadFrequently: true, colorSpace: "srgb" });
  ctx.clearRect(0, 0, width, height);
  ctx.drawImage(bitmap, 0, 0);
  bitmap.close?.();
  let imageData;
  try { imageData = ctx.getImageData(0, 0, width, height, { colorSpace: "srgb" }); }
  catch { imageData = ctx.getImageData(0, 0, width, height); }
  return { data: imageData.data, width, height, mode: "Canvas 精确模式" };
}

async function readPixelsFallback(file) {
  const img = await new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error("无法解码图片"));
    im.src = URL.createObjectURL(file);
  });
  const width = img.naturalWidth, height = img.naturalHeight;
  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.clearRect(0, 0, width, height);
  ctx.drawImage(img, 0, 0);
  const imageData = ctx.getImageData(0, 0, width, height);
  return { data: imageData.data, width, height, mode: "回退模式" };
}

async function readPixelsPrecise(file) {
  try { return await readPixelsPureJS(file); } catch (e) {}
  try { return await readPixelsWebCodecs(file); } catch (e) {}
  try { return await readPixelsBitmap(file); } catch (e) {}
  return await readPixelsFallback(file);
}

async function pixelsToPngBlob(pixels, width, height) {
  const canvas = typeof OffscreenCanvas !== "undefined"
    ? new OffscreenCanvas(width, height)
    : Object.assign(document.createElement("canvas"), { width, height });
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.putImageData(new ImageData(new Uint8ClampedArray(pixels), width, height), 0, 0);
  if (canvas.convertToBlob) return canvas.convertToBlob({ type: "image/png" });
  return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

async function processOne(file, direction, times, baseName, isRestore) {
  const { data, width, height, mode } = await readPixelsPrecise(file);
  if (!width || !height) throw new Error("图片尺寸无效");
  const restored = processPixels(data, width, height, direction, times, isRestore);
  const blob = await pixelsToPngBlob(restored, width, height);
  const filename = `${baseName}_${direction}.png`;
  downloadBlob(blob, filename);
  return { width, height, filename, mode };
}

/* ================= 主流程 ================= */
window.startProcess = async function(id) {
  const isRestore = (id === 1);
  const files = fileStore[id];
  if (!files.length) {
    setStatus(id, "错误：请先选择至少一张图片。");
    return;
  }

  const times = parseInt(document.getElementById('times' + id).value, 10) || 1;
  const doBoth = document.getElementById('both' + id).checked;
  const dirChoice = document.querySelector(`input[name="dir${id}"]:checked`).value;
  const baseName = (document.getElementById('outName' + id).value.trim() || (isRestore ? "restored" : "obfuscated")).replace(/\.(png|jpg|jpeg)$/i, "");

  const btnStart = document.getElementById('btnStart' + id);
  btnStart.disabled = true;
  
  document.getElementById('log' + id).textContent = "";
  setProgress(id, 0);
  let success = 0, failed = 0;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const fileBase = file.name.replace(/\.[^.]+$/, "");
    const name = files.length === 1 ? baseName : `${baseName}_${fileBase}`;
    const dirs = doBoth ? ["A","B"] : [dirChoice];

    setStatus(id, `处理中 ${i+1}/${files.length}：${file.name}`);

    for (const d of dirs) {
      try {
        const r = await processOne(file, d, times, name, isRestore);
        success++;
        appendLog(id, `[成功] ${file.name} [${d}] -> ${r.filename} (${r.width}x${r.height}) · ${r.mode}`);
      } catch (e) {
        failed++;
        appendLog(id, `[失败] ${file.name} [${d}]：${e.message}`);
      }
    }

    setProgress(id, Math.round(((i+1)/files.length)*100));
    await new Promise(r => setTimeout(r, 0));
  }

  const actionStr = isRestore ? "解混淆" : "混淆";
  const summary = `${actionStr}完成：成功 ${success} 次，失败 ${failed} 次`;
  setStatus(id, summary);
  appendLog(id, "—".repeat(40));
  appendLog(id, summary);
  btnStart.disabled = false;
};
</script>
</body>
</html>
